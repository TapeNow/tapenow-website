# Checks every push and pull request. Deploys tapenow.dev only from a version tag
# (vX.Y.Z matching package.json) or a manual run, after the checks pass.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected ref to tapenow.dev
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Bundle dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  deploy:
    needs: check
    if: github.repository == 'TapeNow/tapenow-website' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://tapenow.dev
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Homepage is live
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS https://tapenow.dev/ | grep -q "Build with your agent" && echo live && exit 0
            sleep 10
          done
          exit 1
